<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Для Марішика 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        .slider-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 248, 245, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 64px 64px 56px 56px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .slides-wrapper {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .slides-wrapper::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
            padding: 40px 20px;
            text-align: center;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px 0 20px;
            background: rgba(255,240,240,0.7);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #d96c8a;
            border-radius: 50%;
            transition: 0.2s;
            opacity: 0.4;
        }

        .dot.active {
            width: 24px;
            border-radius: 5px;
            background: #ff4976;
            opacity: 1;
        }

        h2 {
            font-size: 1.9rem;
            margin: 15px 0;
            color: #c73b5c;
            line-height: 1.3;
        }

        .big-emoji {
            font-size: 5rem;
        }

        .heart-wave {
            font-size: 2.8rem;
            line-height: 1.3;
            letter-spacing: 5px;
        }

        .message {
            font-size: 1.6rem;
            font-weight: 600;
            background: #fff0f3dd;
            padding: 14px 12px;
            border-radius: 55px;
            color: #a12e4a;
        }

        .huge-text {
            font-size: 3rem;
            font-weight: 900;
            color: #c73b5c;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.2;
        }

        .swipe-hint {
            font-size: 0.8rem;
            opacity: 0.6;
            padding-bottom: 15px;
            color: #b13e5c;
            text-align: center;
        }

        @media (max-width: 500px) {
            .message { font-size: 1.3rem; }
            h2 { font-size: 1.6rem; }
            .big-emoji { font-size: 4rem; }
            .huge-text { font-size: 2.2rem; }
            .slide { padding: 20px 16px; min-height: 500px; }
        }
    </style>
</head>
<body>
<div class="slider-container">
    <div class="slides-wrapper" id="slidesWrapper">
        <!-- Слайд 1: Мілашик + 5 сердечок -->
        <div class="slide">
            <div class="big-emoji">🤗</div>
            <h2>Ойй, а щоо за мілашик відкрив цю сторіночку?</h2>
            <div class="heart-wave">❤️ ❤️ ❤️ ❤️ ❤️</div>
        </div>

        <!-- Слайд 2: Не грусти + ти робиш світ кращим -->
        <div class="slide">
            <div class="big-emoji">🌧️🤍</div>
            <h2>Нее грусти, малишик...</h2>
            <div class="message">Ти вже робиш цей світ кращим, просто існуючи 💫</div>
        </div>

        <!-- Слайд 3: Посміхнись + тільки сердечка -->
        <div class="slide">
            <div class="big-emoji">😊💕</div>
            <h2>Посміхнись! Тобі дуже личить посмішкаааа</h2>
            <div class="heart-wave">💖 💖 💖 💖 💖</div>
        </div>

        <!-- Слайд 4: просто багато сердечок -->
        <div class="slide">
            <div class="heart-wave" style="font-size: 3rem;" id="heartsSlide">
                ❤️ 💖 💗 💓 💕 💞 💘 💝 💖 ❤️
            </div>
            <button id="addHeartsBtn" style="background:#ffb7c5; border:none; padding: 10px 24px; border-radius: 50px; font-size:1rem; font-weight:bold; color:#a1304b;">💥 додати ще сердечок 💥</button>
        </div>

        <!-- Слайд 5: Принцеса + ЛЮБЛЮ ТЕБЕ МАРІШИК + одне сердечко -->
        <div class="slide">
            <div class="big-emoji">👸🏻💖</div>
            <div class="huge-text">ЛЮБЛЮ ТЕБЕ<br>МАРІШИК</div>
            <div class="heart-wave">❤️</div>
        </div>
    </div>

    <div class="dots" id="dotsContainer"></div>
    <div class="swipe-hint">👉 гортай ліворуч / праворуч 👈</div>
</div>

<script>
    const wrapper = document.getElementById('slidesWrapper');
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dotsContainer');
    let currentIndex = 0;
    let autoScrollTimeout = null;

    function createDots() {
        dotsContainer.innerHTML = '';
        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === currentIndex) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        });
    }

    function updateDots() {
        document.querySelectorAll('.dot').forEach((dot, i) => {
            if (i === currentIndex) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }

    function goToSlide(index) {
        if (index < 0) index = 0;
        if (index >= slides.length) index = slides.length - 1;
        currentIndex = index;
        wrapper.scrollTo({ left: wrapper.clientWidth * currentIndex, behavior: 'smooth' });
        updateDots();
    }

    function updateCurrentOnScroll() {
        const scrollLeft = wrapper.scrollLeft;
        const slideWidth = wrapper.clientWidth;
        const newIndex = Math.round(scrollLeft / slideWidth);
        if (newIndex !== currentIndex && newIndex >= 0 && newIndex < slides.length) {
            currentIndex = newIndex;
            updateDots();
        }
    }

    wrapper.addEventListener('scroll', () => {
        if (autoScrollTimeout) clearTimeout(autoScrollTimeout);
        autoScrollTimeout = setTimeout(updateCurrentOnScroll, 50);
    });

    window.addEventListener('resize', () => goToSlide(currentIndex));

    // Кнопка додавання сердечок на 4 слайді
    const addBtn = document.getElementById('addHeartsBtn');
    const heartsDiv = document.getElementById('heartsSlide');
    if (addBtn && heartsDiv) {
        addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const heartsList = ['❤️','💖','💗','💓','💕','💞','💘','💝'];
            let extra = '';
            for (let i = 0; i < 10; i++) {
                extra += heartsList[Math.floor(Math.random() * heartsList.length)] + ' ';
            }
            heartsDiv.innerHTML += ' ' + extra;
        });
    }

    createDots();
    setTimeout(() => goToSlide(0), 100);
</script>
</body>
</html>
